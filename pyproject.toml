[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "socialsentiment"
version = "2.0.0"
description = "Multi-source live social sentiment tracker with a Dash dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Thomas V. Tomaras" }]
keywords = [
    "sentiment-analysis", "vader", "dash", "plotly", "bluesky", "reddit",
    "rss", "sqlite", "fts5", "finance", "crypto",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "dash>=3.0",
    "plotly>=6.0",
    "pandas>=2.2",
    "vaderSentiment>=3.3.2",
    "websockets>=13",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
reddit = ["praw>=7.7"]
x = ["tweepy>=4.14"]
dev = ["pytest>=8", "flake8>=7", "praw>=7.7", "tweepy>=4.14"]

[project.urls]
Homepage = "https://github.com/Mercury010/socialsentiment"
Repository = "https://github.com/Mercury010/socialsentiment"
Issues = "https://github.com/Mercury010/socialsentiment/issues"
Changelog = "https://github.com/Mercury010/socialsentiment/blob/master/CHANGELOG.md"

[project.scripts]
socialsentiment = "socialsentiment.cli:main"

[tool.setuptools.packages.find]
include = ["socialsentiment*"]

[tool.setuptools.package-data]
socialsentiment = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
