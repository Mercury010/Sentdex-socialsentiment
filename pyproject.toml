[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "socialsentiment"
version = "2.0.0"
description = "Multi-source live social sentiment tracker with a Dash dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "dash>=3.0",
    "plotly>=6.0",
    "pandas>=2.2",
    "vaderSentiment>=3.3.2",
    "websockets>=13",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
reddit = ["praw>=7.7"]
x = ["tweepy>=4.14"]
dev = ["pytest>=8", "flake8>=7", "praw>=7.7", "tweepy>=4.14"]

[project.scripts]
socialsentiment = "socialsentiment.cli:main"

[tool.setuptools.packages.find]
include = ["socialsentiment*"]

[tool.setuptools.package-data]
socialsentiment = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
